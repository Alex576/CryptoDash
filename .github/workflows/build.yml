name: Build SPA Integrated App (Angular + .NET)

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
            path: ~/.nuget/packages
            key: ${{ runner.os }}-nuget-${{ hashFiles('CryptoDashWeb/**/*.csproj') }}
            restore-keys: |
              ${{ runner.os }}-nuget-

      - name: Restore .NET dependencies
        run: dotnet restore CryptoDashWeb.slnx
        working-directory: ./CryptoDashWeb

      - name: Run Angular Tests
        run: |
          npm ci
          npm run test -- --watch=false --run
        working-directory: ./crypto-dash-web
        continue-on-error: false

      - name: Run .NET Tests
        run: dotnet test CryptoDashWeb.slnx --configuration Release --no-restore --verbosity normal
        working-directory: ./CryptoDashWeb


      - name: Publish Integrated Application
        run: dotnet publish CryptoDashWeb.slnx --configuration Release --output ../publish
        working-directory: ./CryptoDashWeb
