name: Build SPA Integrated App (Angular + .NET)

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.sln') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore .NET dependencies
        run: dotnet restore .\CryptoDashWeb\CryptoDashWeb.slnx

      - name: Run .NET Tests
        run: dotnet test .\CryptoDashWeb\CryptoDashWeb.slnx --configuration Release --no-restore

      - name: Publish Integrated Application
        run: dotnet publish .\CryptoDashWeb\CryptoDashWeb\CryptoDashWeb.csproj --configuration Release --output ./publish
