<svg xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
      .cd-bg { fill: #0D1117; stroke: #21262D; stroke-width: 1; }
      .cd-accent-green { stroke: #00E676; fill: none; }
      .cd-accent-red { stroke: #FF5252; fill: none; }
      .cd-muted { fill: #8892B0; }
      .cd-dark-neutral { fill: #161B22; }
      .cd-grid-line { stroke: #21262D; }
        </style>
    </defs>

    <!-- ================================================================= -->
    <!-- 1. ID: chart - ЛИНЕЙНЫЙ ГРАФИК (Chart)                            -->
    <!-- ================================================================= -->
    <svg id="chart" viewBox="0 0 120 80">
        <rect width="120" height="80" rx="6" class="cd-bg"/>
        <line x1="15" y1="65" x2="105" y2="65" class="cd-grid-line" stroke-width="1"/>
        <line x1="15" y1="45" x2="105" y2="45" class="cd-grid-line" stroke-width="0.5" stroke-dasharray="2 2"/>
        <line x1="15" y1="25" x2="105" y2="25" class="cd-grid-line" stroke-width="0.5" stroke-dasharray="2 2"/>
        <path d="M 15 55 Q 30 25 45 45 T 75 25 T 105 35" fill="none" stroke="#00E676" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>

    <!-- ================================================================= -->
    <!-- 2. ID: bars - ГИСТОГРАММА (Bars)                                 -->
    <!-- ================================================================= -->
    <svg id="bars" viewBox="0 0 120 80">
        <rect width="120" height="80" rx="6" class="cd-bg"/>
        <line x1="15" y1="65" x2="105" y2="65" class="cd-grid-line" stroke-width="1"/>
        <path d="M 22 65 L 22 45" stroke="#8892B0" stroke-width="6" stroke-linecap="round"/>
        <path d="M 36 65 L 36 30" stroke="#00E676" stroke-width="6" stroke-linecap="round"/>
        <path d="M 50 65 L 50 55" stroke="#8892B0" stroke-width="6" stroke-linecap="round"/>
        <path d="M 64 65 L 64 20" stroke="#00E676" stroke-width="6" stroke-linecap="round"/>
        <path d="M 78 65 L 78 40" stroke="#8892B0" stroke-width="6" stroke-linecap="round"/>
        <path d="M 92 65 L 92 50" stroke="#8892B0" stroke-width="6" stroke-linecap="round"/>
        <path d="M 106 65 L 106 35" stroke="#00E676" stroke-width="6" stroke-linecap="round"/>
    </svg>

    <!-- ================================================================= -->
    <!-- 3. ID: table - ТАБЛИЦА (Table)                                   -->
    <!-- ================================================================= -->
    <svg id="table" viewBox="0 0 120 80">
        <rect width="120" height="80" rx="6" class="cd-bg"/>
        <rect x="12" y="15" width="96" height="10" rx="2" class="cd-dark-neutral"/>
        <circle cx="22" cy="20" r="2" class="cd-muted"/>
        <circle cx="50" cy="20" r="2" class="cd-muted"/>
        <circle cx="85" cy="20" r="2" class="cd-muted"/>

        <line x1="12" y1="36" x2="108" y2="36" class="cd-grid-line" stroke-width="1"/>
        <rect x="18" y="31" width="12" height="3" rx="1.5" class="cd-muted"/>
        <rect x="45" y="31" width="20" height="3" rx="1.5" class="cd-grid-line"/>
        <rect x="80" y="31" width="15" height="3" rx="1.5" fill="#00E676"/>

        <line x1="12" y1="52" x2="108" y2="52" class="cd-grid-line" stroke-width="1"/>
        <rect x="18" y="47" width="15" height="3" rx="1.5" class="cd-muted"/>
        <rect x="45" y="47" width="12" height="3" rx="1.5" class="cd-grid-line"/>
        <rect x="80" y="47" width="18" height="3" rx="1.5" fill="#FF5252"/>

        <line x1="12" y1="68" x2="108" y2="68" class="cd-grid-line" stroke-width="1"/>
        <rect x="18" y="63" width="10" height="3" rx="1.5" class="cd-muted"/>
        <rect x="45" y="63" width="25" height="3" rx="1.5" class="cd-grid-line"/>
        <rect x="80" y="63" width="12" height="3" rx="1.5" fill="#00E676"/>
    </svg>

    <!-- ================================================================= -->
    <!-- 4. ID: pie-chart - КРУГОВАЯ ДИАГРАММА (Pie)                      -->
    <!-- ================================================================= -->
    <svg id="pie-chart" viewBox="0 0 120 80">
        <rect width="120" height="80" rx="6" class="cd-bg" />
        <circle cx="40" cy="40" r="22" class="cd-dark-neutral" />
        <circle cx="40" cy="40" r="11" fill="none" stroke="#8892B0" stroke-width="22" stroke-dasharray="25 100" stroke-dashoffset="0" />
        <circle cx="40" cy="40" r="11" fill="none" stroke="#00E676" stroke-width="22" stroke-dasharray="45 100" stroke-dashoffset="-25" />
        <rect x="75" y="25" width="18" height="4" rx="2" fill="#00E676" />
        <rect x="75" y="37" width="22" height="4" rx="2" fill="#8892B0" />
        <rect x="75" y="49" width="14" height="4" rx="2" class="cd-dark-neutral" />
    </svg>

    <!-- ================================================================= -->
    <!-- 5. ID: donut-chart - ПОНЧИК (Donut)                              -->
    <!-- ================================================================= -->
    <svg id="donut-chart" viewBox="0 0 120 80">
        <rect width="120" height="80" rx="6" class="cd-bg" />
        <circle cx="40" cy="40" r="20" fill="none" class="cd-dark-neutral" stroke-width="6" />
        <circle cx="40" cy="40" r="20" fill="none" stroke="#00E676" stroke-width="6" stroke-dasharray="55 130" stroke-dashoffset="0" stroke-linecap="round" />
        <circle cx="40" cy="40" r="20" fill="none" stroke="#8892B0" stroke-width="6" stroke-dasharray="35 130" stroke-dashoffset="-60" stroke-linecap="round" />
        <circle cx="40" cy="40" r="20" fill="none" stroke="#FF5252" stroke-width="6" stroke-dasharray="20 130" stroke-dashoffset="-100" stroke-linecap="round" />
        <circle cx="78" cy="27" r="3" fill="#00E676" />
        <rect x="86" y="25" width="12" height="4" rx="2" class="cd-grid-line" />
        <circle cx="78" cy="40" r="3" fill="#8892B0" />
        <rect x="86" y="38" width="12" height="4" rx="2" class="cd-grid-line" />
        <circle cx="78" cy="53" r="3" fill="#FF5252" />
        <rect x="86" y="51" width="12" height="4" rx="2" class="cd-grid-line" />
    </svg>

    <!-- ================================================================= -->
    <!-- 6. ID: single-value - ОДИНОЧНОЕ ЗНАЧЕНИЕ (Single Value)          -->
    <!-- ================================================================= -->
    <svg id="single-value" viewBox="0 0 120 80">
        <rect width="120" height="80" rx="6" class="cd-bg" />
        <rect x="12" y="15" width="35" height="4" rx="2" class="cd-grid-line" />
        <rect x="12" y="26" width="55" height="12" rx="3" class="cd-muted" />
        <rect x="74" y="29" width="24" height="7" rx="2.5" class="cd-dark-neutral" />
        <path d="M 79 33 L 82 31 L 85 33 M 82 31 L 82 35" fill="none" stroke="#00E676" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M 12 65 Q 25 55 35 62 T 65 48 T 98 52" fill="none" stroke="#00E676" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
</svg>
