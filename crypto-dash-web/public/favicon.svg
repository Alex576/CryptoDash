<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <!-- Скругленный темно-синий фон вкладки -->
  <rect width="32" height="32" rx="7" fill="#0D1117"/>

  <!-- Тонкая фоновая сетка дашборда -->
