<div class="single-select">
  <mat-form-field class="single-select__field" [class.changed]="updated()" [class.invalid]="isInvalid()">
    <mat-label>{{name() | translate}}</mat-label>
    <mat-select [formControl]="formControl"
                (opened)="onOpen()"
                (closed)="onClosed()">
      <app-search (onSearchTextChanged)="onSearch($event)" />
      @for (item of filteredItems(); track item.id) {
      <mat-option [value]="item.id">{{item.name}}</mat-option>
      }
    </mat-select>
  </mat-form-field>
</div>
