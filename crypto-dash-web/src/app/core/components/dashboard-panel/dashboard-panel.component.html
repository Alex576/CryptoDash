<div class="dashboard-panel">
  @let config = gridsterConfig();
  @if (config) {
  <gridster class="dashboard-panel__gridster" [options]="config">
    @for (item of dashboardItems(); track item.id) {
    <gridster-item class="dashboard-panel__gridster__item"
                   [item]="item.options"
                   (itemChange)="onItemChange($event, item)">
      <div class="item">
        <div class="item__header">
          <div class="item__header__name" [appDynamicToolTip]="item.name">
            {{item.name}}</div>
          <div class="item__header__actions">
            <button matIconButton (click)="onOpenItem(item.id)">
              <mat-icon class="icon">edit</mat-icon>
            </button>
          </div>
        </div>
        @if (isPreview()){
        <mat-icon class="fit" [svgIcon]="getPreviewIcon(item.type)"></mat-icon>
        }
        @else {
        <div class="item__content">
          <app-dashboard-switch [item]="item" [data]="item.data" />
        </div>
        }
        <!-- <div class="item__fields">
          @for (field of item.fields; track field.name) {
          <div class="item__fields__field">
            <div>{{field.name}}</div>
            <div>{{field.value}}</div>
          </div>
          }
        </div> -->
      </div>
    </gridster-item>
    }
  </gridster>
  }
</div>
