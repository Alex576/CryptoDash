<div class="dashboard-switch">
  @let dashboardItem = item();
  @switch (dashboardItem.type) {
  @case (dashboardType.Bars) {
  <app-dashboard-bars [item]="dashboardItem" [data]="data()" />
  }
  @case (dashboardType.Chart) {
  <app-dashboard-chart [item]="dashboardItem" />
  }
  @case (dashboardType.Table) {
  <app-dashboard-table [item]="dashboardItem" />
  }
  }
</div>
