<div class="dashboard">
  <app-filters [filters]="filters()" (valueChanged)="onFilterChanged($event)" />
  @let dashboardItems = items();
  @if (dashboardItems){
  <app-dashboard-panel [options]="options()" [items]="dashboardItems" (onItemSizeChange)="onItemSizeChange($event)" />
  }
  @else {
  <app-loading />
  }
</div>
