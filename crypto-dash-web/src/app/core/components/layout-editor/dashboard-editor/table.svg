<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 80" width="100%" height="100%">
    <!-- Фон -->
    <rect width="120" height="80" rx="6" fill="#0D1117" stroke="#21262D" stroke-width="1"/>

    <!-- Шапка таблицы (выделена более светлым тоном) -->
    <rect x="12" y="15" width="96" height="10" rx="2" fill="#161B22"/>
    <circle cx="22" cy="20" r="2" fill="#8892B0"/>
    <circle cx="50" cy="20" r="2" fill="#8892B0"/>
    <circle cx="85" cy="20" r="2" fill="#8892B0"/>

    <!-- Строка 1 -->
    <line x1="12" y1="36" x2="108" y2="36" stroke="#21262D" stroke-width="1"/>
    <rect x="18" y="31" width="12" height="3" rx="1.5" fill="#8892B0"/>
    <rect x="45" y="31" width="20" height="3" rx="1.5" fill="#21262D"/>
    <rect x="80" y="31" width="15" height="3" rx="1.5" fill="#00E676"/>

    <!-- Строка 2 -->
    <line x1="12" y1="52" x2="108" y2="52" stroke="#21262D" stroke-width="1"/>
    <rect x="18" y="47" width="15" height="3" rx="1.5" fill="#8892B0"/>
    <rect x="45" y="47" width="12" height="3" rx="1.5" fill="#21262D"/>
    <rect x="80" y="47" width="18" height="3" rx="1.5" fill="#FF5252"/>
    <!-- Красный цвет для разнообразия (падение цены) -->

    <!-- Строка 3 -->
    <line x1="12" y1="68" x2="108" y2="68" stroke="#21262D" stroke-width="1"/>
    <rect x="18" y="63" width="10" height="3" rx="1.5" fill="#8892B0"/>
    <rect x="45" y="63" width="25" height="3" rx="1.5" fill="#21262D"/>
    <rect x="80" y="63" width="12" height="3" rx="1.5" fill="#00E676"/>
</svg>
